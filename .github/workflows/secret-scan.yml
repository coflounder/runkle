# Installed by the jhbstack secure plugin. Scans for credentials that still
# work: new commits on every push and pull request, full history nightly.
# A finding fails the run, and GitHub emails failed runs to you.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * *"  # daily, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --only-verified
