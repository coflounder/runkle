name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Runs only where Cloudflare settings exist, so a fork deploys by adding
  # its own secret and variables (see README, Deploy).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PORTAL_ID: ${{ vars.PORTAL_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >
          npx wrangler deploy
          --var "ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
          --var "PORTAL_ID:$PORTAL_ID"
          --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN"
          --var "ACCESS_AUD:$ACCESS_AUD"
      # runkle calls the Cloudflare API with the same token at run time.
      - run: printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
      - if: env.NOTIFY_URL != ''
        run: printf '%s' "$NOTIFY_URL" | npx wrangler secret put NOTIFY_URL
